name: heating

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heating

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GOPROXY: direct
      FENIX_EMAIL: ${{ secrets.FENIX_EMAIL }}
      FENIX_PASSWORD: ${{ secrets.FENIX_PASSWORD }}
      HC_PING_URL: ${{ secrets.HC_PING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/zimmicz/fenix@main
      - run: fenix log
      - run: fenix forecast
      - if: ${{ !cancelled() }}
        run: |
          git config user.name "log-bot"
          git config user.email "log-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "log $(date -u +%FT%TZ)"
          git pull --rebase
          git push
      - if: ${{ success() && env.HC_PING_URL != '' }}
        run: curl -fsS -m 10 --retry 3 "$HC_PING_URL" > /dev/null
      - if: ${{ failure() && env.HC_PING_URL != '' }}
        run: curl -fsS -m 10 --retry 3 "$HC_PING_URL/fail" > /dev/null
