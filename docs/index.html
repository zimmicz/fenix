<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Heating">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Heating</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--fg:#000;--muted:#8a8a8e;--sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.14);--fill2:rgba(120,120,128,.24);
  --heat:#ff6b1a;--heat-bg:linear-gradient(160deg,#ff8a3d,#ff5a1f);--eco:#30b07a;--frost:#2f8cff;--off:#8e8e93;--sched:#8e5cf7;--boost:#ff3b30;--comfort:#f5bd1f;--manual:#00a3a3;
  --seg-on:#fff;--sheet:var(--bg);--sheet-card:var(--card);--accent:#ff6b1a;--green:#34c759;--red:#ff3b30;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--card:#1c1c1e;--fg:#fff;--muted:#8d8d93;--sep:rgba(84,84,88,.6);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--shadow:none;--seg-on:#636366;--sheet:#1c1c1e;--sheet-card:#2c2c2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--fg:#fff;--muted:#8d8d93;--sep:rgba(84,84,88,.6);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--shadow:none;--seg-on:#636366;--sheet:#1c1c1e;--sheet-card:#2c2c2e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;margin:12px 4px 18px}
.hdr h1{font-size:34px;font-weight:700;letter-spacing:.2px;margin:0;line-height:1.1}
.hdr .sub{color:var(--muted);font-size:15px;margin-top:4px}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.section{font-size:13px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin:26px 16px 8px}
.note{font-size:13px;color:var(--muted);margin:8px 16px 0;line-height:1.4}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:22px;padding:14px 16px 16px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;min-height:148px;position:relative;overflow:hidden;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .name{font-size:15px;font-weight:600}
.tile .temp{font-size:44px;font-weight:300;letter-spacing:-1px;margin-top:auto;line-height:1}
.tile .temp sup{font-size:22px;font-weight:400;vertical-align:top;position:relative;top:6px;margin-left:1px}
.tile .meta{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--muted)}
.tile.heating{background:var(--heat-bg);color:#fff}
.tile.heating .meta{color:rgba(255,255,255,.85)}
.tile .flame{position:absolute;top:14px;right:14px;width:22px;height:22px;opacity:.95}
.tile .pending{position:absolute;top:16px;right:16px;width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.6;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.15}}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.tile.heating .dot{background:#fff!important}

.group{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:10px 16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .label{flex:1;min-width:0}
.row .value{color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row input[type=text],.row input[type=datetime-local],.row input[type=email],.row input[type=password],.row input[type=number],.row select{border:0;background:none;text-align:right;color:var(--muted);flex:1;min-width:0;padding:0;outline:none;-webkit-appearance:none;appearance:none}
.row select{direction:rtl}
.row .chev{color:var(--muted);opacity:.6;flex:none}.row .chev svg{width:8px;height:14px;display:block}
.row>.seg{flex:1}
.row.action{color:var(--accent);justify-content:center}
.row.danger{color:var(--red);justify-content:center}
.row .two{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.row .two small{color:var(--muted);font-size:14px}
.badge{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--muted);flex:none}
.badge.on{background:rgba(52,199,89,.15);color:var(--green)}
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.switch:checked{background:var(--green)}.switch:checked::after{transform:translateX(20px)}

.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:14px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.1)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mode{background:var(--fill);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:500}
.mode svg{width:24px;height:24px}
.mode.on{color:#fff}

.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:50%;background:var(--fill);font-size:22px;font-weight:400;display:grid;place-items:center;color:var(--accent)}
.stepper button:disabled{opacity:.35}
.stepper .v{min-width:64px;text-align:center;font-size:22px;font-variant-numeric:tabular-nums;font-weight:500}

.days{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.day{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.day .when{font-size:15px;font-weight:600}.day .date{font-size:13px;color:var(--muted)}
.day .wx{display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px}
.day .wx svg{width:44px;height:44px}
.day .t{font-size:32px;font-weight:300;letter-spacing:-.5px}.day .t small{font-size:17px;color:var(--muted);margin-left:4px}
.day .m{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--muted);margin-top:6px;white-space:nowrap}
.day .m b{color:var(--fg);font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--fill);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#ffc53d,#ff8a00)}

.warn{background:rgba(255,59,48,.12);color:var(--fg);border-radius:16px;padding:12px 16px;margin:-6px 0 14px;font-size:15px;display:flex;flex-direction:column;gap:4px}.warn b{color:var(--red)}
.away{background:rgba(48,176,122,.14);border-radius:16px;padding:12px 12px 12px 16px;margin:-6px 0 14px;font-size:15px;display:flex;align-items:center;gap:12px}.away>div{flex:1;display:flex;flex-direction:column;gap:2px}.away>div div{color:var(--muted);font-size:13px}.away .btn{min-width:0;padding:10px 14px;flex:none}
.help{background:var(--sheet-card);border-radius:14px;padding:14px 16px;margin-bottom:10px}.help h3{margin:0 0 6px;font-size:17px}.help p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.step{display:flex;gap:12px;background:var(--sheet-card);border-radius:14px;padding:14px 16px;margin-bottom:10px}.step .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center}.step .body{min-width:0}.step h3{margin:3px 0 6px;font-size:17px}.step p{margin:0;color:var(--muted);font-size:15px;line-height:1.45;overflow-wrap:anywhere}.step .link{display:inline-block;margin-top:10px;color:var(--accent);font-weight:600;text-decoration:none;font-size:15px}
.empty{background:var(--card);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:var(--shadow)}
.empty svg{width:56px;height:56px;color:var(--accent)}
.empty h2{margin:12px 0 6px;font-size:22px}
.empty p{color:var(--muted);margin:0 0 18px;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-weight:600;border-radius:14px;padding:14px 22px;min-width:180px}
.btn.secondary{background:var(--fill);color:var(--accent)}
.btn:disabled{opacity:.5}
.skel{background:var(--card);border-radius:22px;min-height:148px;box-shadow:var(--shadow);animation:pulse 1s ease-in-out infinite alternate}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);z-index:5}
nav button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--muted)}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--accent)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.scrim.enter{animation:fade .2s}
.sheet .group{background:var(--sheet-card)}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
.scrim.enter .sheet{animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 10px}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.sheet-hdr h2{font-size:22px;margin:0}
.sheet-hdr .done{color:var(--accent);font-weight:600}
.hero{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 4px 18px}
.hero .temp{font-size:64px;font-weight:200;letter-spacing:-2px;line-height:1}
.hero .temp sup{font-size:28px;vertical-align:top;position:relative;top:10px}
.hero .state{text-align:right;color:var(--muted);font-size:15px}
.hero .state b{display:block;color:var(--fg);font-size:17px;font-weight:600}
.hero .state.heating b{color:var(--heat)}
.status{font-size:13px;color:var(--muted);text-align:center;margin-top:12px;min-height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.chip{padding:7px 14px;border-radius:999px;background:var(--fill);font-size:15px}
.chip.on{background:var(--accent);color:#fff}

.savebar{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));display:none;justify-content:center;z-index:6}
.savebar.show{display:flex}
body.dirty{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.savebar .btn{box-shadow:0 8px 24px rgba(255,107,26,.35);width:100%;max-width:528px}
#toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 10px);display:flex;justify-content:center;z-index:20;pointer-events:none}
.week{display:flex;flex-direction:column;gap:6px;padding:12px 16px}
.week button{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);border-radius:6px}
.week button.on{color:var(--fg);font-weight:600}
.week button span{width:24px;text-align:left}
.week button i{flex:1;height:14px;border-radius:4px}
.week button.on i{outline:2px solid var(--accent);outline-offset:2px}
.hours{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;padding:12px 16px;touch-action:none;user-select:none;-webkit-user-select:none}
.hours div{height:36px;border-radius:6px}
.hours small{font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px}
.ubars{display:flex;gap:8px;padding:14px 16px 12px}
.ucol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.ucol small{color:var(--muted);font-size:11px;white-space:nowrap}
.ucol b{font-weight:500;font-size:12px}
.ubar{width:100%;max-width:32px;height:140px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;background:var(--fill)}
.ubar i{display:block;flex:none}
#toast span{background:var(--card);color:var(--fg);padding:12px 18px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.18);font-size:15px;font-weight:500;animation:fade .2s}
</style>
</head>

<div id="sheet"></div>
<div class="savebar" id="savebar"><button class="btn" id="savebtn">Save changes</button></div>
<div id="toast"></div>
<nav id="nav"></nav>

}

const lang = () => {
  const l = store.get().lang
  if (l === 'cs' || l === 'en') return l
  return (navigator.language || '').toLowerCase().startsWith('cs') ? 'cs' : 'en'
}
const locale = () => lang() === 'cs' ? 'cs-CZ' : 'en-GB'
function t (key, ...args) {
  const v = TEXT[lang()][key] ?? TEXT.en[key] ?? key
  return typeof v === 'function' ? v(...args) : v.replace(/\{(\d)\}/g, (_, i) => args[i])
}
const modeLabel = m => t('m_' + m.key)
const facadeLabel = a => t('f_' + (a < 0 ? 'm' + -a : a))

const S = { tab: 'zones', token: null, home: null, zones: null, busy: {}, status: {}, draft: {}, config: null, configSha: null, state: null, forecast: null, outdoor: null, sheet: null, dirty: false, loading: false }

function h (tag, props = {}, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else if (k === 'class') el.className = v
    else if (k === 'icon') el.innerHTML = ICONS[v]
    else if (k === 'style') el.style.cssText = v
    else if (k.includes('-')) el.setAttribute(k, v)
    else if (v !== undefined && v !== null && v !== false) el[k] = v
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid)
  return el
}
const icon = (name, cls = '') => h('span', { class: cls, icon: name, style: 'display:inline-flex' })

function toast (msg) {
  const el = document.getElementById('toast')
  el.replaceChildren(h('span', {}, msg))
  clearTimeout(toast.timer)
  toast.timer = setTimeout(() => el.replaceChildren(), 2600)
}

function act (fn) {
  return async (...a) => {
    try { return await fn(...a) } catch (e) { toast(e.message) }
  }
}

const toC = raw => Math.round((Number(raw) - 320) / 18 * 10) / 10
const toRaw = c => String(Math.round(c * 18 + 320))
const fmt = c => num1(Math.round(c * 10) / 10)
const title = s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase()

async function login () {
  const { email, password } = store.get()
  if (!email || !password) throw new Error(t('errSignInFirst'))
  const r = await fetch(`https://auth.${HOST}/realms/fenix/protocol/openid-connect/token`, {
    method: 'POST',
    body: new URLSearchParams({ grant_type: 'password', client_id: 'app-front', username: email, password })
  })
  if (r.status === 401) throw new Error(t('errWrongLogin'))
  if (!r.ok) throw new Error(t('errSignIn', r.status))
  const tok = await r.json()
  S.token = tok.access_token
  S.tokenExp = Date.now() + ((tok.expires_in || 300) - 30) * 1000
  const u = await api('human/user/read/', { email })
  if (!u.smarthomes?.length) throw new Error(t('errNoHome'))
  const home = u.smarthomes[0]
  S.home = { id: home.smarthome_id, lat: Number(home.latitude), lon: Number(home.longitude) }
}

async function api (endpoint, form, ok = [1, 8]) {
  if (Date.now() > S.tokenExp) await login()
  const r = await fetch(`https://${HOST}/api/v0.1/${endpoint}`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${S.token}` },
    body: new URLSearchParams(form)
  })
  if (!r.ok) throw new Error(t('errFenix', r.status))
  const j = await r.json()
  if (!ok.includes(Number(j.code?.code))) throw new Error(`Fenix: ${j.code?.value || j.code?.key}`)
  return j.data
}

async function loadZones () {
  if (!S.token) await login()
  const d = await api('human/smarthome/read/', { smarthome_id: S.home.id })
  S.zones = d.zones.filter(z => z.devices?.length).map(z => ({ label: z.zone_label, d: z.devices[0] }))
  const sched = store.get().schedule || {}
  for (const z of S.zones) if (!MODES.some(m => m.code === String(z.d.gv_mode)) && String(z.d.gv_mode) !== '11') sched[z.label] = String(z.d.gv_mode)
  store.set({ schedule: sched })
}

const zoneMode = z => MODES.find(m => m.code === String(z.d.gv_mode)) || MODES[0]
const scheduleCode = z => (store.get().schedule || {})[z.label] || '11'

function push (label, params) {
  const z = S.zones.find(z => z.label === label)
  const form = { smarthome_id: S.home.id, context: '1', peremption: '15000', 'query[id_device]': z.d.id_device }
  for (const [k, v] of Object.entries(params)) form[`query[${k}]`] = v
  return api('human/query/push/', form, [8])
}

async function write (label, params, field, want, statusText) {
  S.busy[label] = (S.busy[label] || 0) + 1
  S.status[label] = statusText
  render()
  try {
    await push(label, params)
    S.status[label] = t('waitingUnit')
    render()
    for (let i = 0; i < 12; i++) {
      await new Promise(r => setTimeout(r, 5000))
      await loadZones()
      const cur = S.zones.find(z => z.label === label)
      if (String(cur?.d[field]) === want) { S.status[label] = t('saved'); return }
    }
    S.status[label] = t('notConfirmed')
  } catch (e) {
    S.status[label] = ''
    throw e
  } finally {
    S.busy[label]--
    if (S.draft[label]) delete S.draft[label][field]
    render()
  }
}

const setMode = (label, m) => act(() => {
  const z = S.zones.find(z => z.label === label)
  const code = m.key === 'program' ? scheduleCode(z) : m.code
  return write(label, { gv_mode: code, nv_mode: code }, 'gv_mode', code, t('switchingTo', modeLabel(m)))
})()

const stepTimers = {}
function step (label, field, delta) {
  const z = S.zones.find(z => z.label === label)
  const lo = toC(z.d.min_set_point); const hi = toC(z.d.max_set_point)
  S.draft[label] = S.draft[label] || {}
  const cur = S.draft[label][field] ?? toC(z.d[field])
  const next = Math.min(hi, Math.max(lo, Math.round((cur + delta) * 2) / 2))
  S.draft[label][field] = next
  S.status[label] = ''
  render()
  clearTimeout(stepTimers[label + field])
  stepTimers[label + field] = setTimeout(act(() => write(label, { [field]: toRaw(next) }, field, toRaw(next), t('saving'))), 1200)
}

async function gh (path, opts = {}) {
  const { repo, ghToken } = store.get()
  if (!repo || !ghToken) throw new Error(t('errGhFirst'))
  return fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    ...opts,
    headers: { Authorization: `Bearer ${ghToken}`, Accept: 'application/vnd.github+json', ...opts.headers }
  })
}
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)))
const b64encode = s => btoa(Array.from(new TextEncoder().encode(s), b => String.fromCharCode(b)).join(''))

async function ghRead (path) {
  const r = await gh(path)
  if (r.status === 404) return { data: null, sha: null }
  if (r.status === 401) throw new Error(t('errGhToken'))
  if (!r.ok) throw new Error(t('errGh', r.status))
  const j = await r.json()
  return { data: JSON.parse(b64decode(j.content)), sha: j.sha }
}

async function loadUsage () {
  if (!S.zones) await loadZones()
  S.usage = await api('human/stats/read/', { smarthome_id: S.home.id })
}

async function loadConfig () {
  const { data, sha } = await ghRead('config.json')
  S.config = { lat: null, lon: null, ntfy_topic: randomTopic(), auto_adjust: false, sun: { lead_hours: 3, share: 50, heads_up_hour: 18 }, rooms: {}, rules: [], ...data }
  delete S.config.facade_azimuth
  S.config.rules = S.config.rules.filter(r => METRICS[r.metric])
  S.configSha = sha
  S.state = (await ghRead('data/state.json')).data
  if (S.config.away && S.state?.away_restored === S.config.away.until) delete S.config.away
  if (S.config.lang !== lang()) { setDirty(true); return }
  setDirty(false)
}

async function saveConfig () {
  S.config.lang = lang()
  const body = { message: 'config: update from web app', content: b64encode(JSON.stringify(S.config, null, 2) + '\n') }
  if (S.configSha) body.sha = S.configSha
  const r = await gh('config.json', { method: 'PUT', body: JSON.stringify(body) })
  if (r.status === 409) throw new Error(t('errConflict'))
  if (!r.ok) throw new Error(t('errSave', r.status))
  S.configSha = (await r.json()).content.sha
  setDirty(false)
  toast(t('savedToast'))
  await act(loadForecast)()
}

const awayOn = () => S.config?.away && S.state?.away_restored !== S.config.away.until
const warmup = () => S.config?.away_warmup_hours ?? sunCfg().lead_hours

async function leave (until) {
  const prev = {}
  for (const z of S.zones) {
    const s = S.state?.sun?.[z.label]
    prev[z.label] = s?.applied && !s.done && s.prev ? s.prev : { gv_mode: String(z.d.gv_mode), nv_mode: String(z.d.nv_mode ?? z.d.gv_mode) }
  }
  S.config.away = { until, prev }
  await saveConfig()
  await Promise.all(S.zones.filter(z => !['3', '2', '1'].includes(String(z.d.gv_mode))).map(z => push(z.label, { gv_mode: '3', nv_mode: '3' })))
  await loadZones()
}

async function backNow () {
  const prev = S.config.away.prev
  await Promise.all(S.zones.filter(z => String(z.d.gv_mode) === '3' && prev[z.label] && prev[z.label].gv_mode !== '3').map(z => push(z.label, prev[z.label])))
  delete S.config.away
  await saveConfig()
  await loadZones()
  toast(t('welcomeBack'))
}

function setDirty (v) {
  S.dirty = v
  document.getElementById('savebar').classList.toggle('show', v)
  document.body.classList.toggle('dirty', v)
}

const randomTopic = () => 'heating-' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('')

async function loadForecast () {
  const c = S.config || {}
  if (c.lat == null || c.lon == null) { if (!S.home) await login() }
  const base = { latitude: c.lat ?? S.home.lat, longitude: c.lon ?? S.home.lon, timezone: 'auto', forecast_days: 2 }
  const get = async extra => {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?${new URLSearchParams({ ...base, ...extra })}`)
    if (!r.ok) throw new Error(t('errForecast', r.status))
    return r.json()
  }
  const azimuths = [...new Set(Object.values(c.rooms || {}).flatMap(r => r.windows || []).map(w => w.azimuth))]
  const [j, ...hourly] = await Promise.all([
    get({ current: 'temperature_2m', daily: 'temperature_2m_max,temperature_2m_min,sunshine_duration' }),
    ...azimuths.map(az => get({ hourly: 'global_tilted_irradiance', tilt: 90, azimuth: az }))
  ])
  S.gti = {}
  azimuths.forEach((az, k) => {
    S.gti[az] = Object.fromEntries(hourly[k].hourly.time.map((tm, i) => [tm, hourly[k].hourly.global_tilted_irradiance[i] || 0]))
  })
  S.outdoor = j.current?.temperature_2m
  S.forecast = j.daily.time.map((date, i) => ({
    date, tmax: j.daily.temperature_2m_max[i], tmin: j.daily.temperature_2m_min[i], sunshine: j.daily.sunshine_duration[i] / 3600
  }))
}

const sunCfg = () => ({ lead_hours: 3, share: 50, heads_up_hour: 18, ...(S.config?.sun || {}) })

function sunWindow (label, date) {
  const room = S.config?.rooms?.[label]
  const z = S.zones?.find(z => z.label === label)
  const power = Number(z?.d.puissance_app)
  if (!room?.windows?.length || !power || !S.gti) return null
  const sc = sunCfg()
  let first = -1; let last = -1
  for (let hr = 0; hr < 24; hr++) {
    const tm = `${date}T${String(hr).padStart(2, '0')}:00`
    const gain = room.windows.reduce((sum, w) => sum + w.width * w.height * Math.max(w.count || 1, 1) * (S.gti[w.azimuth]?.[tm] || 0) * 0.6, 0)
    if (gain >= sc.share / 100 * power) { if (first < 0) first = hr; last = hr }
  }
  return first < 0 ? null : { start: Math.max(0, first - sc.lead_hours), sunStart: first, sunEnd: last + 1 }
}
const hh = n => `${String(n).padStart(2, '0')}:00`
const planText = (label, d, i) => {
  const w = sunWindow(label, d.date)
  return `${t(i ? 'tomorrow' : 'today')}: ${w ? t('sunPlan', hh(w.sunStart), hh(w.sunEnd), hh(w.start)) : t('notEnoughSun')}`
}

async function refresh () {
  S.loading = true
  render()
  try {
    const s = store.get()
    await Promise.all([
      s.email && act(loadZones)(),
      s.repo && s.ghToken && act(loadConfig)(),
      S.tab === 'usage' && s.email && act(loadUsage)()
    ])
    if (s.email || S.config) await act(loadForecast)()
  } finally {
    S.loading = false
    render()
  }
}

function awaySheet () {
  const d = new Date()
  d.setDate(d.getDate() + 1)
  d.setHours(18, 0, 0, 0)
  const local = new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16)
  return formSheet(t('away'), [['until', t('backOn'), 'datetime-local', '', local]], t('leave'), async v => {
    const until = new Date(v.until)

    await leave(until.toISOString())

function checkCard () {
  const last = S.state?.last_run && new Date(S.state.last_run)
  if (!S.config || !last) return null
  const ago = (Date.now() - last) / 36e5
  const at = last.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' })
  if (ago < 2) return h('div', { class: 'note', style: 'margin:-10px 4px 14px' }, t('checkRan', at))
  const sunOn = Object.entries(S.state.sun || {}).filter(([, s]) => s.applied && !s.done).map(([l]) => title(l))
  return h('div', { class: 'warn' },
    h('b', {}, ago < 48 ? t('noCheckH', Math.floor(ago)) : t('noCheckD', Math.floor(ago / 24))),
    h('div', {}, t('lastRan', last.toLocaleString(locale(), { weekday: 'short', hour: '2-digit', minute: '2-digit' }))),
    sunOn.length ? h('div', {}, t('stillEco', sunOn.join(', '))) : null)
}

const toSlots = p => [...p].flatMap(c => { const n = parseInt(c, 16); return [n >> 2, n & 3] })
const fromSlots = s => s.filter((_, i) => i % 2 === 0).map((v, i) => ((v << 2) | s[i * 2 + 1]).toString(16).toUpperCase()).join('')
const stripes = qs => qs.every(q => q === qs[0]) ? levelColor(qs[0]) : `linear-gradient(90deg,${qs.map((q, i) => `${levelColor(q)} ${i / qs.length * 100}% ${(i + 1) / qs.length * 100}%`).join(',')})`

const wxIcon = d => d.sunshine >= 6 ? h('span', { icon: 'sun', style: 'color:#ffb020;display:inline-flex' }) : d.sunshine >= 2 ? h('span', { icon: 'partly', style: 'display:inline-flex' }) : h('span', { icon: 'cloud', style: 'color:#b8c2cf;display:inline-flex' })

function ruleText (r) {
  return `${t(r.day)} · ${t('met_' + r.metric).toLowerCase()} ${t(r.op === '>' ? 'above' : 'below')} ${String(r.value).replace('.', lang() === 'cs' ? ',' : '.')} ${METRICS[r.metric]}`
}
const ruleHits = r => {
  if (!S.forecast) return false
  const v = S.forecast[r.day === 'today' ? 0 : 1][r.metric]
  return r.op === '>' ? v > r.value : v < r.value
}

function sunPlanRow (label) {
  const room = S.config.rooms[label]
  const f = S.forecast
  const plan = f ? f.map((d, i) => planText(label, d, i)).join(' · ') : '…'
  const active = S.state?.sun?.[label]
  const on = active && active.date === f?.[0]?.date && active.applied && !active.done
  return h('button', { class: 'row', onclick: () => openSheet({ type: 'room', label }) },

const ROOM_COLORS = ['#ff6b1a', '#2f8cff', '#30b07a', '#8e5cf7', '#f5bd1f', '#ff3b30', '#00a3a3', '#8e8e93']
const kwh = v => `${num1(v)} kWh`

const dayRooms = day => Object.entries(day || {}).filter(([k]) => k !== 'all').map(([k, v]) => [k, Number(v?.conso_day) || 0])
const daySum = day => dayRooms(day).reduce((a, [, v]) => a + v, 0)

function usageView () {
  if (!store.get().email) return [header(t('usage')), h('div', { class: 'group', style: 'margin-top:20px' }, h('button', { class: 'row action', onclick: () => openSheet({ type: 'login' }) }, t('signIn')))]
  if (!S.usage) {
    if (!S.usageTried) { S.usageTried = true; act(loadUsage)().then(render) }
    return [header(t('usage'), t('loading'), true), h('div', { class: 'skel' })]
  }
  const u = S.usage
  const price = Number(store.get().price) || 0
  const cost = v => `${Math.round(v * price).toLocaleString(locale())} Kč`
  const money = v => price ? ` · ${cost(v)}` : ''
  const cur = u.stats_by_day?.statsByDayCurrentMonth || {}
  const last = u.stats_by_day?.statsByDayLastMonth || {}
  const curMonth = Number(u.current_month); const curYear = Number(u.current_year)
  const zoneName = num => title(S.zones?.find(z => String(z.d.num_zone) === String(num))?.label || String(num))
  const nums = [...new Set([cur, last].flatMap(m => Object.values(m).flatMap(d => dayRooms(d).map(([k]) => k))))].sort((a, b) => a - b)
  const color = k => ROOM_COLORS[nums.indexOf(k) % ROOM_COLORS.length]
  const days = Array.from({ length: 14 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - 13 + i)
    return { d, day: (d.getMonth() + 1 === curMonth ? cur : last)[d.getDate()] }
  })
  const max = Math.max(...days.map(x => daySum(x.day)), 0.1)
  const soFar = Object.values(cur).reduce((a, d) => a + daySum(d), 0)
  const elapsed = Math.max(0, ...Object.keys(cur).filter(k => daySum(cur[k]) > 0).map(Number))
  const inMonth = new Date(curYear, curMonth, 0).getDate()
  const projected = elapsed ? soFar / elapsed * inMonth : 0
  const lastTotal = Object.values(last).reduce((a, d) => a + daySum(d), 0)
  const roomMonth = nums.map(k => [k, Object.values(cur).reduce((a, d) => a + (dayRooms(d).find(([n]) => n === k)?.[1] || 0), 0)]).sort((a, b) => b[1] - a[1])
  const monthName = (m, y) => new Date(y, m - 1, 1).toLocaleDateString(locale(), { month: 'long' })
  const row = (label, v, small) => h('div', { class: 'row' }, h('div', { class: 'two' }, h('span', {}, label), small ? h('small', {}, small) : null),
    h('div', { class: 'two', style: 'flex:none;text-align:right' }, h('span', {}, kwh(v)), price ? h('small', {}, cost(v)) : null))
  return [
    header(t('usage'), `${title(monthName(curMonth, curYear))} · ${kwh(soFar)}${money(soFar)}`, true),
    h('div', { class: 'group' }, h('div', { class: 'ubars', style: 'gap:3px' }, days.map(({ d, day }) => h('div', { class: 'ucol' },
      h('small', {}, day ? Math.round(daySum(day)) : '–'),
      h('div', { class: 'ubar' }, dayRooms(day).map(([k, v]) => v ? h('i', { style: `height:${v / max * 100}%;background:${color(k)}` }) : null)),
      h('b', {}, String(d.getDate())))))),
    h('div', { class: 'group', style: 'margin-top:16px' },
      row(t('monthSoFar'), soFar, elapsed ? t('nDays', elapsed) : null),
      projected ? row(t('monthProjected'), projected, t('atThisPace')) : null,
      lastTotal ? row(title(monthName(Number(u.last_month), Number(u.last_year))), lastTotal) : null),
    price ? null : h('div', { class: 'group', style: 'margin-top:16px' }, h('button', { class: 'row action', onclick: () => { S.tab = 'settings'; render() } }, t('setPrice'))),
    h('div', { class: 'section' }, t('byRoomMonth')),
    h('div', { class: 'group' }, roomMonth.map(([k, v]) => h('div', { class: 'row' },
      h('span', { class: 'dot', style: `background:${color(k)}` }), h('span', { class: 'label' }, zoneName(k)),
      h('span', { class: 'value' }, `${kwh(v)}${money(v)} · ${soFar ? Math.round(v / soFar * 100) : 0} %`)))),
    h('div', { class: 'note' }, t('usageNote'))
  ]
}

function navRow (label, value, onclick) {

function numStepper (value, stepBy, lo, hi, set, unit = '') {
  const apply = d => { set(Math.min(hi, Math.max(lo, Math.round((value + d) * 10) / 10))); setDirty(true); render() }
  return h('div', { class: 'stepper' },
    h('button', { disabled: value <= lo, onclick: () => apply(-stepBy) }, '−'),
    h('span', { class: 'v', style: 'min-width:60px;font-size:17px' }, `${String(value).replace('.', lang() === 'cs' ? ',' : '.')}${unit}`),
    h('button', { disabled: value >= hi, onclick: () => apply(stepBy) }, '+'))
}

  return [

function roomSheet (label) {
  const c = S.config
  const room = c.rooms[label] || { sun: true, windows: [] }
  const upd = fn => {
    fn()
    c.rooms[label] = room
    setDirty(true)
    render()
    if (room.windows.some(w => !S.gti?.[w.azimuth])) act(loadForecast)().then(render)
  }
  const z = S.zones?.find(z => z.label === label)
  const power = Number(z?.d.puissance_app) || 0
  const num = (w, key, labelText) => h('label', { class: 'row' }, h('span', { class: 'label' }, labelText),
    h('input', { type: 'number', inputMode: 'decimal', step: '0.1', min: '0.1', value: w[key], oninput: e => { const v = Number(e.target.value.replace(',', '.')); if (v > 0) { w[key] = v; c.rooms[label] = room; setDirty(true) } } }),
    h('span', { class: 'value', style: 'flex:none' }, 'm'))
  const plan = S.forecast?.map((d, i) => planText(label, d, i))
  return [
    h('div', { class: 'sheet-hdr' }, h('h2', {}, title(label)), h('button', { class: 'done', onclick: closeSheet }, t('done'))),
    h('div', { class: 'group' },
      h('label', { class: 'row' }, h('span', { class: 'label' }, t('useSun')),
        h('input', { type: 'checkbox', class: 'switch', checked: room.sun, onchange: e => upd(() => { room.sun = e.target.checked }) }))),
    h('div', { class: 'note' }, power ? t('heater', num1(power / 1000)) : t('heaterUnknown'), room.windows.length && plan ? ' ' + plan.join(' · ') + '.' : ''),
    room.windows.map((w, i) => [
      h('div', { class: 'section' }, t('windowN', i + 1)),
      h('div', { class: 'group' },
        h('label', { class: 'row' }, h('span', { class: 'label' }, t('faces')),
          h('select', { onchange: e => upd(() => { w.azimuth = Number(e.target.value) }) }, FACADES.map(a => h('option', { value: a, selected: w.azimuth === a }, facadeLabel(a))))),
        num(w, 'width', t('width')),
        num(w, 'height', t('height')),
        h('div', { class: 'row' }, h('div', { class: 'two' }, h('span', {}, t('howMany')), h('small', {}, t('identical'))), numStepper(w.count || 1, 1, 1, 20, v => { w.count = v; c.rooms[label] = room })),
        h('button', { class: 'row danger', onclick: () => upd(() => { room.windows.splice(i, 1) }) }, t('removeWindow')))
    ]),
    h('div', { class: 'section' }, ''),
    h('div', { class: 'group' }, h('button', {
      class: 'row action',
      onclick: () => upd(() => { room.windows.push({ ...(room.windows.at(-1) || { azimuth: -22, width: 1, height: 2.5 }), count: 1 }) })
    }, t('addWindow'))),
    h('div', { class: 'note' }, t('measureGlass'))
  ]
}

      ['Dej robotovi přihlášení k Fenixu', 'V novém repozitáři: Settings → Secrets and variables → Actions → New repository secret. Přidej FENIX_EMAIL s e-mailem k Fenixu a pak FENIX_PASSWORD s heslem. GitHub je drží zašifrované.'],
      ['Spusť robota', 'Otevři záložku Actions, případně potvrď zapnutí workflows, vyber heating → Run workflow. Asi za minutu zezelená.'],
      ['Vytvoř klíč', 'Repository access: Only select repositories → tvůj repozitář. Permissions → Repository permissions → Actions: Read and write a Contents: Read and write. Klepni na Generate token a zkopíruj ho (začíná github_pat_). Použiješ ho v krocích 8 a 9.', ['Vytvořit token', 'token']],
      ['Spouštěj ho každou hodinu', 'Vlastní časovač GitHubu většinu hodin vynechá, proto robota spouští bezplatný účet na cron-job.org. Zaregistruj se a dej Create cronjob. URL: https://api.github.com/repos/tvoje-jméno/topeni/actions/workflows/heating.yml/dispatches. Schedule: každou hodinu v 7. minutě. V Advanced: Request method POST, hlavičky Authorization = Bearer, mezera a klíč z kroku 7, a Accept = application/vnd.github+json, Request body {"ref":"main"}. Ulož a klepni na Test run: v záložce Actions tvého repozitáře přibude nový běh.', ['Registrace na cron-job.org', 'cron']],
      ['Připoj aplikaci', 'V této aplikaci: Nastavení → GitHub. Repozitář = tvoje-jméno/topeni, Token = klíč z kroku 7. Klepni na Připojit.', null, 'github'],
      ['Zapni notifikace', 'Nainstaluj ntfy. Tady klepni na Nastavení → Zkopírovat téma. V ntfy klepni na +, vlož téma a přihlas se k odběru. Pak tady klepni na Poslat testovací notifikaci.', ['ntfy v App Store', 'ntfy']],
      ['Zadej okna', 'Nastavení → Místnosti a okna: u každé místnosti přidej okna (směr, šířka × výška, počet). Pár dní sleduj plán v záložce Předpověď a pak zapni Automaticky přepínat na útlum.'],
      ['Upozornění, když se robot zastaví', 'Na healthchecks.io vytvoř check s periodou 1 hodina a grace 1 hodina. V Integrations přidej ntfy s tvým tématem a serverem https://ntfy.sh. Ping URL checku ulož jako secret HC_PING_URL v repozitáři, stejně jako v kroku 5.', ['Otevřít healthchecks.io', 'hc']]
    ]
  }
}

function setupSheet () {
  const g = SETUP[lang()]
  const step = (i, [head, body, link, action]) => h('div', { class: 'step' },
    h('div', { class: 'num' }, String(i + 1)),
    h('div', { class: 'body' }, h('h3', {}, head), h('p', {}, body),
      link ? h('a', { class: 'link', href: LINKS[link[1]], target: '_blank', rel: 'noopener' }, link[0] + ' ↗') : null,
      action === 'signin' && !store.get().email ? h('button', { class: 'link', onclick: () => openSheet({ type: 'login' }) }, t('signIn')) : null,
      action === 'github' && !store.get().repo ? h('button', { class: 'link', onclick: () => openSheet({ type: 'github' }) }, t('connect')) : null))
  return [
    h('div', { class: 'sheet-hdr' }, h('h2', {}, t('setupGuide')), h('button', { class: 'done', onclick: closeSheet }, t('done'))),
    h('div', { class: 'note', style: 'margin:0 4px 8px' }, g.intro),
    h('div', { class: 'section' }, g.basic), g.steps.slice(0, 2).map((s, i) => step(i, s)),
    h('div', { class: 'section' }, g.robot), g.steps.slice(2, 11).map((s, i) => step(i + 2, s)),
    h('div', { class: 'section' }, g.extra), step(11, g.steps[11])
  ]
}
function helpSheet () {
  return [
    h('div', { class: 'sheet-hdr' }, h('h2', {}, t('howItWorks')), h('button', { class: 'done', onclick: closeSheet }, t('done'))),
    HELP[lang()].map(([head, body]) => h('div', { class: 'help' }, h('h3', {}, head), h('p', {}, body))),
    h('div', { class: 'group', style: 'margin-top:16px' }, h('button', { class: 'row action', onclick: () => openSheet({ type: 'setup' }) }, t('setupGuide')))
  ]
}

function formSheet (titleText, fields, submitLabel, onsubmit, extra) {
  const inputs = {}
  return [
    h('div', { class: 'sheet-hdr' }, h('h2', {}, titleText), h('button', { class: 'done', onclick: closeSheet }, t('cancel'))),
    h('div', { class: 'group' }, fields.map(([key, label, type, placeholder, value]) =>
      h('label', { class: 'row' }, h('span', { class: 'label', style: 'flex:none' }, label),
        inputs[key] = h('input', { type, placeholder, value: value ?? '', autocomplete: type === 'password' ? 'current-password' : 'off', autocapitalize: 'off', spellcheck: false })))),
    extra,
    h('div', { style: 'text-align:center;margin-top:20px' }, h('button', {
      class: 'btn',
      onclick: async e => {
        e.target.disabled = true
        try { await onsubmit(Object.fromEntries(Object.entries(inputs).map(([k, el]) => [k, el.value.trim()]))) } catch (err) { toast(err.message) } finally { e.target.disabled = false }
      }
    }, submitLabel))
  ]
}

function sheetContent () {
  const sh = S.sheet
  const s = store.get()
  if (sh.type === 'zone') return zoneSheet(sh.label)
  if (sh.type === 'program') return programSheet(sh)
  if (sh.type === 'rule') return ruleSheet(sh.index)
  if (sh.type === 'room') return roomSheet(sh.label)
  if (sh.type === 'help') return helpSheet()
  if (sh.type === 'setup') return setupSheet()
  if (sh.type === 'away') return awaySheet()
  if (sh.type === 'login') {
    return formSheet(t('fenixAccount'), [['email', t('email'), 'email', 'you@example.com', s.email], ['password', t('password'), 'password', t('required'), s.password]], t('signIn'), async v => {
      store.set(v)
      S.token = null
      await loadZones()
      closeSheet()
      toast(t('signedIn'))
      act(loadForecast)().then(render)
    }, h('div', { class: 'note' }, t('fenixNote')))
  }
  if (sh.type === 'github') {
    return formSheet('GitHub', [['repo', t('repository'), 'text', 'owner/name', s.repo], ['ghToken', t('token'), 'password', 'github_pat_…', s.ghToken]], t('connect'), async v => {
      store.set(v)
      await loadConfig()
      await act(loadForecast)()
      closeSheet()
      toast(t('connected'))
    }, h('div', { class: 'note' }, t('ghSheetNote')))
  }
  if (sh.type === 'location') {
    const c = S.config
    return formSheet(t('location'), [['lat', t('latitude'), 'number', S.home ? String(S.home.lat) : t('fenixHome'), c.lat], ['lon', t('longitude'), 'number', S.home ? String(S.home.lon) : t('fenixHome'), c.lon]], t('useThese'), async v => {
      c.lat = v.lat === '' ? null : Number(v.lat)
      c.lon = v.lon === '' ? null : Number(v.lon)
      setDirty(true)
      closeSheet()
      act(loadForecast)().then(render)
    }, h('div', {},
      h('div', { class: 'note' }, t('locNote')),
      h('div', { class: 'group', style: 'margin-top:16px' }, h('button', {
        class: 'row action',
        onclick: () => navigator.geolocation.getCurrentPosition(p => {
          c.lat = Math.round(p.coords.latitude * 1e4) / 1e4
          c.lon = Math.round(p.coords.longitude * 1e4) / 1e4
          setDirty(true)
          closeSheet()
          act(loadForecast)().then(render)
        }, e => toast(e.message))
      }, t('useMyLocation')))))
  }
}

function render () {
  const views = { zones: zonesView, forecast: forecastView, usage: usageView, settings: settingsView }
  const y = scrollY
  document.title = t('appName')
  document.getElementById('savebtn').textContent = t('saveChanges')
  document.getElementById('app').replaceChildren(...[views[S.tab]()].flat(Infinity).filter(Boolean))
  document.getElementById('nav').replaceChildren(...[['zones', 'home', 'home'], ['forecast', 'forecast', 'sun'], ['usage', 'usage', 'chart'], ['settings', 'settings', 'gear']].map(([tab, l, i]) =>
    h('button', { class: S.tab === tab ? 'on' : '', onclick: () => { S.tab = tab; scrollTo(0, 0); render() } }, icon(i), t(l))))
  const host = document.getElementById('sheet')
  const content = S.sheet && sheetContent()
  if (S.sheet && !content) S.sheet = null
  if (!S.sheet) {
    host.replaceChildren()
  } else {
    const prev = host.querySelector('.sheet')?.scrollTop || 0
    const active = document.activeElement
    if (active?.tagName === 'INPUT' && host.contains(active) && active.type !== 'checkbox') return scrollTo(0, y)
    const sheet = h('div', { class: 'sheet' }, h('div', { class: 'grab' }), content)
    host.replaceChildren(h('div', { class: 'scrim' + (S.sheet.enter ? ' enter' : ''), onclick: e => { if (e.target === e.currentTarget) closeSheet() } }, sheet))
    sheet.scrollTop = S.sheet.enter ? 0 : prev
    S.sheet.enter = false
  }
  scrollTo(0, y)
}

document.documentElement.lang = lang()
document.getElementById('savebtn').addEventListener('click', async e => {
  e.target.disabled = true
  await act(saveConfig)()
  e.target.disabled = false
  render()
})
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.token && !Object.values(S.busy).some(Boolean)) act(async () => { await loadZones(); render() })()
})
refresh()
</script>
</body>
</html>
